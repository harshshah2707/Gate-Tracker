services:
  - type: web
    name: gate-warroom-backend
    runtime: docker
    dockerfilePath: ./apps/backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false          # You paste this from Supabase / Render Postgres
      - key: JWT_SECRET
        generateValue: true  # Render auto-generates a secure random value
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
    autoDeploy: true

databases:
  # Uncomment below ONLY if you want Render-managed Postgres instead of Supabase
