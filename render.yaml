services:
  - type: web
    name: gate-warroom-backend
    runtime: docker
    dockerfilePath: ./apps/backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gate-warroom-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true  # Render auto-generates a secure random value
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
    autoDeploy: true

databases:
  - name: gate-warroom-db
    plan: free
    databaseName: gatewarroom
